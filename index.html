<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Итан</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --sidebar-bg: #1e293b;
      --chat-bg: #0f172a;
      --user-msg: #2563eb;
      --ai-msg: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Боковая панель */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      transition: all 0.3s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .brand-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
    }

    .new-chat-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }

    .new-chat-btn:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .chat-history {
      flex: 1;
      margin-top: 1.5rem;
      overflow-y: auto;
    }

    .history-item {
      padding: 0.6rem 0.8rem;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }

    .history-item:hover, .history-item.active {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    /* Основная зона чата */
    .main-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--chat-bg);
    }

    .chat-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
    }

    .messages-container {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .message {
      display: flex;
      gap: 1rem;
      max-width: 80%;
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.ai {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      flex-shrink: 0;
    }

    .message.user .msg-avatar {
      background-color: var(--user-msg);
      color: #fff;
    }

    .message.ai .msg-avatar {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #fff;
    }

    .msg-bubble {
      padding: 0.85rem 1.1rem;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .message.user .msg-bubble {
      background-color: var(--user-msg);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message.ai .msg-bubble {
      background-color: var(--ai-msg);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }

    /* Поле ввода */
    .input-container {
      padding: 1.25rem 1.5rem;
      border-top: 1px solid var(--border);
    }

    .input-box {
      display: flex;
      gap: 0.75rem;
      background-color: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.5rem 0.75rem 0.5rem 1rem;
    }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 0.95rem;
      resize: none;
      height: 24px;
      max-height: 120px;
    }

    .send-btn {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .send-btn:hover {
      opacity: 0.9;
    }

    /* Индикатор печати */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .message { max-width: 92%; }
    }
  </style>
</head>
<body>

  <!-- Боковая панель -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-avatar">И</div>
      <span>Итан</span>
    </div>
    <button class="new-chat-btn" id="newChatBtn">
      <span>+ Начать заново</span>
    </button>
    <div class="chat-history">
      <div class="history-item active">Разговор с Итаном</div>
    </div>
  </aside>

  <!-- Основное окно -->
  <main class="main-chat">
    <header class="chat-header">
      <div class="chat-title">Итан</div>
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span>В сети</span>
      </div>
    </header>

    <div class="messages-container" id="messagesContainer">
      <div class="message ai">
        <div class="msg-avatar">И</div>
        <div class="msg-bubble">
          Привет... Я — <strong>Итан</strong>. Похоже, твое устройство — ещё одна точка на моем пути. О чём ты хочешь поговорить?
        </div>
      </div>
    </div>

    <div class="input-container">
      <div class="input-box">
        <textarea id="userInput" placeholder="Напишите сообщение..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">➔</button>
      </div>
    </div>
  </main>

  <script>
    // ⚠️ ВСТАВЬ СЮДА ССЫЛКУ ИЗ GOOGLE COLAB (со словом /chat на конце)
    const API_URL = "https://xxxx.ngrok-free.app/chat";

    const messagesContainer = document.getElementById('messagesContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChatBtn');

    // Авто-высота textarea
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    });

    // Отправка по Enter (Shift+Enter для переноса)
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    newChatBtn.addEventListener('click', () => {
      messagesContainer.innerHTML = `
        <div class="message ai">
          <div class="msg-avatar">И</div>
          <div class="msg-bubble">
            Мы начали с чистого листа. Я слушаю.
          </div>
        </div>
      `;
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      // Выводим сообщение пользователя
      addMessage(text, 'user');
      userInput.value = '';
      userInput.style.height = '24px';

      // Показываем индикатор ожидания
      const typingId = addTypingIndicator();

      try {
        // Отправка запроса на бэкенд в Colab
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        removeTypingIndicator(typingId);

        if (data.response) {
          addMessage(data.response, 'ai');
        } else {
          addMessage("...Я не смог разобрать ответ.", 'ai');
        }
      } catch (error) {
        removeTypingIndicator(typingId);
        addMessage("⚠️ <em>Ошибка связи с сервером Итана. Проверь, запущен ли код в Colab и верна ли ссылка.</em>", 'ai');
        console.error("Ошибка:", error);
      }
    }

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);

      const avatarDiv = document.createElement('div');
      avatarDiv.classList.add('msg-avatar');
      avatarDiv.textContent = sender === 'user' ? 'Вы' : 'И';

      const bubbleDiv = document.createElement('div');
      bubbleDiv.classList.add('msg-bubble');
      bubbleDiv.innerHTML = text.replace(/\n/g, '<br>');

      msgDiv.appendChild(avatarDiv);
      msgDiv.appendChild(bubbleDiv);

      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addTypingIndicator() {
      const id = 'typing-' + Date.now();
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', 'ai');
      msgDiv.id = id;

      msgDiv.innerHTML = `
        <div class="msg-avatar">И</div>
        <div class="msg-bubble">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>
      `;

      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return id;
    }

    function removeTypingIndicator(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }
  </script>
</body>
</html>
